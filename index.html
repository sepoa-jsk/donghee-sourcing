<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>동희산업 개발구매 솔루션 — 데모 런처</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html, body {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg-page);
    }
    .launcher-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 4px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      width: 440px;
      padding: 40px 36px 32px;
      text-align: center;
    }
    .launcher-logo {
      font-size: 13px;
      font-weight: 600;
      color: var(--primary);
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }
    .launcher-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.3;
      margin-bottom: 6px;
    }
    .launcher-subtitle {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 32px;
    }
    .launcher-buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 28px;
    }
    .launcher-btn-primary {
      display: block;
      width: 100%;
      padding: 14px;
      background: #0747A6;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s;
    }
    .launcher-btn-primary:hover { background: #063A87; }
    .launcher-btn-secondary {
      display: block;
      width: 100%;
      padding: 11px;
      background: #fff;
      color: var(--text-primary);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: border-color 0.15s, background 0.15s;
    }
    .launcher-btn-secondary:hover { border-color: #0747A6; background: #EBF0FF; }
    .launcher-info {
      border-top: 1px solid var(--border);
      padding-top: 20px;
      text-align: left;
    }
    .launcher-info-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }
    .launcher-info-row:last-child { margin-bottom: 0; }
    .launcher-info-label { color: var(--text-muted); }
    .launcher-note {
      margin-top: 16px;
      font-size: 11px;
      color: var(--text-muted);
      background: #FFFBE6;
      border: 1px solid #FFE58F;
      border-radius: 4px;
      padding: 8px 12px;
      line-height: 1.6;
      text-align: left;
    }
  </style>
  <script src="js/mock-data.js"></script>
</head>
<body>
  <div class="launcher-card">
    <div class="launcher-logo">DONGHEE INDUSTRIAL</div>
    <div class="launcher-title">동희산업<br>개발구매 솔루션</div>
    <div class="launcher-subtitle">고객 데모 시스템 v1.0</div>

    <div class="launcher-buttons">
      <a href="app.html" class="launcher-btn-primary">▶ 데모 시작</a>
      <button class="launcher-btn-secondary" onclick="resetDemo()">🔄 데모 데이터 초기화</button>
      <a href="demo/scenario-guide.html" class="launcher-btn-secondary">📋 시연 가이드</a>
    </div>

    <div class="launcher-info">
      <div class="launcher-info-row">
        <span class="launcher-info-label">화면 수</span>
        <span>43개 (9개 모듈)</span>
      </div>
      <div class="launcher-info-row">
        <span class="launcher-info-label">기술 스택</span>
        <span>HTML + CSS + JavaScript (서버 불필요)</span>
      </div>
      <div class="launcher-info-row">
        <span class="launcher-info-label">데이터</span>
        <span>localStorage 기반 Mock 데이터</span>
      </div>
      <div class="launcher-note">
        ※ 본 시스템은 프로토타입 데모이며, 본 구축 시 Java + MariaDB로 전환됩니다.
      </div>
    </div>
  </div>

  <script>
    function resetDemo() {
      if (confirm('데모 데이터를 초기화하시겠습니까?')) {
        localStorage.clear();
        MockData.reset();
        alert('초기화 완료');
      }
    }
  </script>
</body>
</html>
