<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>동희산업 개발구매 솔루션</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body>

  <!-- GNB -->
  <div class="gnb" id="gnb"></div>

  <!-- 사이드바 -->
  <div class="sidebar" id="sidebar"></div>

  <!-- 타이틀바 -->
  <div class="titlebar" id="titlebar">
    <span class="titlebar-text" id="titlebar-text">화면을 선택해주세요</span>
    <span class="titlebar-breadcrumb" id="titlebar-breadcrumb"></span>
  </div>

  <!-- 메인 콘텐츠 -->
  <div class="main-content" id="main-content">
    <div class="empty-state" style="margin-top:120px;">
      <div class="empty-state-icon">☰</div>
      <div>좌측 메뉴에서 화면을 선택해주세요</div>
    </div>
  </div>

  <!-- 하단 탭바 -->
  <div class="bottom-tabs" id="bottom-tabs"></div>

  <button id="portal-switch" onclick="App.togglePortal()"
    style="position:fixed; bottom:44px; right:16px; z-index:999;
    padding:8px 16px; border-radius:20px; border:none; cursor:pointer;
    font-size:12px; font-weight:500; display:inline-flex; align-items:center; gap:6px;
    background:#085041; color:#fff; box-shadow:0 2px 8px rgba(0,0,0,0.15);">
    <i data-lucide="repeat"></i> 협력사 포털 전환
  </button>

  <script src="js/mock-data.js"></script>
  <script src="js/calc-engine.js"></script>
  <script src="js/common.js"></script>
  <script src="js/modules/m01-master.js"></script>
  <script src="js/modules/m02-bom.js"></script>
  <script src="js/app.js"></script>
  <script>document.addEventListener('DOMContentLoaded', () => { if (typeof lucide !== 'undefined') lucide.createIcons(); });</script>
</body>
</html>
